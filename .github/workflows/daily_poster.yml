name: Daily Automated Tech Threads to X

on:
  schedule:
    # 1st Run: 03:00 AM UTC (8:30 AM IST / 11:00 PM EST) - Morning peak reading slot
    - cron: '0 3 * * *'
    # 2nd Run: 13:00 PM UTC (6:30 PM IST / 9:00 AM EST) - Evening peak engagement slot
    - cron: '0 13 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write # Needed to commit updated posted_history.json back to repo

jobs:
  publish_thread:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate & Publish Thread to X
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          TWITTER_HANDLE: ${{ secrets.TWITTER_HANDLE || 'YourHandle' }}
        run: |
          python main.py --post

      - name: Commit and Push Updated History
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add posted_history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update posted history [skip ci]" && git push)
